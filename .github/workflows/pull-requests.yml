name: PR Automation

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Call the reusable test workflow
  run-tests:
    uses: ./.github/workflows/run-tests.yml # <-- Calling your separate test file

  # 2. Handle Dependabot auto-merge
  dependabot-merge:
    runs-on: ubuntu-latest
    needs: run-tests # <-- Tests must pass first!
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Approve and trigger auto-merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
