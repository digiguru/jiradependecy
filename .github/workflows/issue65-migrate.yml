name: issue 65 migration validation

on:
  push:
    branches:
      - fix/issue-65-viz-security

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-65-viz-security

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile safely
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check removed legacy dependency ancestry
        run: |
          if npm ls viz.js @babel/core babel-jest jest glob --all 2>/dev/null | grep -E 'viz\.js@|@babel/core|babel-jest|jest@|glob@10\.'; then
            echo 'Legacy Viz.js, Babel/Jest, or deprecated glob ancestry remains'
            exit 1
          fi
          echo 'Legacy Viz.js, Babel/Jest, and glob@10 ancestry removed'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Smoke test Viz.js browser module route
        run: |
          node src/server.js &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:4000/vendor/viz/viz.js > /dev/null

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Regenerate lockfile for issue 65"
            git push origin HEAD:fix/issue-65-viz-security
          fi
